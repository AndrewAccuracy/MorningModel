name = "AI Top 10"
max_age = "7d"

collection_prompt = """
请输出“AI Top 10”。
每条包括：
1. 原文标题
2. 来源
3. 2-4 句中文摘要
4. 1 句“入选优势”
优先选择国际影响力强、信息密度高、方向性强的 AI 新闻。
排序规则：全球影响力、方向性、信息密度、与产业格局的关系、是否值得今天继续追踪。
“入选优势”必须说明这条相对于普通 AI 新闻的优势：全球影响力、产业方向、技术/产品变化、竞争格局或后续可追踪性。
"""

[llm_settings]
n_most_important_news = 10
k_words_each_summary = 140

[filter_settings]
filter_query = """
Include only entries that are genuinely important for an international AI observer.
Keep:
- frontier models
- AI agents
- inference / training infrastructure
- open-source models with meaningful ecosystem impact
- AI policy and regulation
- AI safety and security
- major funding, acquisitions, strategic partnerships
Exclude:
- tutorials
- small feature launches
- repetitive commentary
- low-signal reposts
- generic product marketing
"""

[[feeds]]
url = "https://openai.com/news/rss.xml"
name = "OpenAI News"
max_articles = 10
follow_article_links = false  # openai.com blocks all sub-link crawling (403)

