name = "AI Top 10"
max_age = "7d"

collection_prompt = """
请输出“AI Top 10”。
每条包括：
1. 原文标题
2. 来源
3. 2-4 句中文摘要
4. 1 句“入选优势”
优先选择国际影响力强、信息密度高、方向性强的 AI 新闻。
排序规则：全球影响力、方向性、信息密度、与产业格局的关系、是否值得今天继续追踪。
“入选优势”必须说明这条相对于普通 AI 新闻的优势：全球影响力、产业方向、技术/产品变化、竞争格局或后续可追踪性。
这不是泛科技新闻列表。融资、事故、诉讼、人物观点、商业模式和单家公司新闻可以入选，
但必须能连接到一条更大的 AI 主线：基础模型能力、agent 落地、算力/数据基础设施、
开源生态、AI 资本开支周期、平台竞争、监管/责任框架、安全风险或企业采用曲线。
如果只是孤立事件，不能说明 AI 行业走向，就不要列入 AI Top 10。
"""

[llm_settings]
n_most_important_news = 10
k_words_each_summary = 140

[filter_settings]
filter_query = """
Include only entries that are genuinely important for an international AI observer.
Keep:
- frontier models
- AI agents
- inference / training infrastructure
- open-source models with meaningful ecosystem impact
- AI policy and regulation
- AI safety and security
- major funding, acquisitions, strategic partnerships
Exclude:
- isolated autonomous-vehicle crashes, criminal cases, lawsuits, funding rounds, or company anecdotes that do not reveal a broader AI regulation, deployment, platform, infrastructure, capital-allocation, or safety trend
- EV/transportation stories where AI is incidental rather than the core industry signal
- tutorials
- small feature launches
- repetitive commentary
- low-signal reposts
- generic product marketing
"""

[[feeds]]
url = "https://openai.com/news/rss.xml"
name = "OpenAI News"
max_articles = 10
follow_article_links = false  # openai.com blocks all sub-link crawling (403)

