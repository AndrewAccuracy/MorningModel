  <line x1="972" y1="74" x2="1232" y2="74" stroke="#1a1a1a" stroke-width="1"/>
  <text x="1102" y="88" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.5" fill="#888" text-anchor="middle">WEDNESDAY, MAY 20, 2026</text>
  <line x1="882" y1="96" x2="1322" y2="96" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="882" y1="100" x2="1322" y2="100" stroke="#1a1a1a" stroke-width="0.8"/>

