  <text x="900" y="132" font-family="Georgia,'Times New Roman',serif" font-size="10" font-style="italic" fill="#222">Google I/O 宣布搜索范式转变，全球债市抛售潮与</text>
  <text x="900" y="146" font-family="Georgia,'Times New Roman',serif" font-size="10" font-style="italic" fill="#222">中东能源冲击构成宏观对冲压力。</text>
  <line x1="882" y1="154" x2="1322" y2="154" stroke="#ddd" stroke-width="0.8"/>

