    <line x1="432" y1="0" x2="432" y2="480"/> <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="528" y1="0" x2="528" y2="480"/> <line x1="576" y1="0" x2="576" y2="480"/>
    <line x1="624" y1="0" x2="624" y2="480"/> <line x1="672" y1="0" x2="672" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/> <line x1="768" y1="0" x2="768" y2="480"/>
    <line x1="816" y1="0" x2="816" y2="480"/> <line x1="864" y1="0" x2="864" y2="480"/>
    <line x1="912" y1="0" x2="912" y2="480"/> <line x1="960" y1="0" x2="960" y2="480"/>
