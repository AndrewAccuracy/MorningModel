  <!-- ── LEFT COPY ── -->
  <circle cx="64" cy="72" r="5" fill="#e8813a"/>
  <text x="78" y="77" font-family="monospace" font-size="11" letter-spacing="2" fill="#e8813a" font-weight="600">DELIVERED DAILY · 07:00 BEIJING TIME</text>

  <text x="64" y="152" font-family="system-ui,Arial,sans-serif" font-size="56" font-weight="800" fill="#f5ead8" letter-spacing="-1">41 RSS feeds.</text>
  <text x="64" y="216" font-family="system-ui,Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    <tspan fill="#f5ead8">One </tspan><tspan fill="url(#accent)">morning email.</tspan>
  </text>

  <text x="64" y="264" font-family="system-ui,Arial,sans-serif" font-size="15.5" fill="#d4c4ad">MorningModel pulls high-signal AI &amp; Finance sources, filters with LLM scoring,</text>
  <text x="64" y="284" font-family="system-ui,Arial,sans-serif" font-size="15.5" fill="#d4c4ad">deduplicates across history, and ships a ranked Chinese digest — automatically.</text>

