  <rect x="64"  y="314" width="136" height="28" rx="14" fill="#e8813a" fill-opacity="0.10" stroke="#e8813a" stroke-opacity="0.45" stroke-width="1"/>
  <text x="132" y="332" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#f5b075" font-weight="500" text-anchor="middle">🤖  AI Top 10</text>

  <rect x="210" y="314" width="168" height="28" rx="14" fill="#3ecf8e" fill-opacity="0.08" stroke="#3ecf8e" stroke-opacity="0.4" stroke-width="1"/>
  <text x="294" y="332" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#6edeb0" font-weight="500" text-anchor="middle">🔬  Research &amp; Safety</text>

  <rect x="388" y="314" width="140" height="28" rx="14" fill="#4a9eff" fill-opacity="0.08" stroke="#4a9eff" stroke-opacity="0.4" stroke-width="1"/>
