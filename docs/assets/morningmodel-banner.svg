  <text x="64"  y="394" font-family="system-ui,Arial,sans-serif" font-size="30" font-weight="800" fill="#f5ead8">41</text>
  <text x="64"  y="415" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#9e8c76">RSS FEEDS</text>

  <text x="150" y="394" font-family="system-ui,Arial,sans-serif" font-size="30" font-weight="800" fill="#f5ead8">3</text>
  <text x="150" y="415" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#9e8c76">COLLECTIONS</text>

  <text x="210" y="394" font-family="system-ui,Arial,sans-serif" font-size="30" font-weight="800" fill="#f5ead8">8</text>
  <text x="210" y="415" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#9e8c76">EMAIL PROVIDERS</text>

