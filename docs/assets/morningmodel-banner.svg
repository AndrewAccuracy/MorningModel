  <rect x="882" y="410" width="440" height="40" fill="#faf8f4"/>
  <line x1="882" y1="410" x2="1322" y2="410" stroke="#ddd" stroke-width="0.8"/>
  <text x="1102" y="432" font-family="Arial,sans-serif" font-size="9" fill="#ccc" text-anchor="middle">Better Morning · 每日 07:00 北京时间送达</text>
  <rect x="882" y="438" width="440" height="12" rx="10" fill="#faf8f4"/>

  <!-- RSS flow lines -->
  <g opacity="0.55">
    <text x="798" y="163" font-family="monospace" font-size="10" fill="#9e8c76" text-anchor="end">OpenAI Blog</text>
    <circle cx="806" cy="159" r="3" fill="#e8813a" opacity="0.5"/>
    <line x1="808" y1="159" x2="878" y2="185" stroke="#e8813a" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="798" y="225" font-family="monospace" font-size="10" fill="#9e8c76" text-anchor="end">arXiv AI</text>
