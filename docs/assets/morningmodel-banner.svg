<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480" role="img" aria-label="MorningModel — 41 RSS feeds, One morning email">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a0f06"/>
      <stop offset="55%"  stop-color="#0d0a07"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <radialGradient id="glow-o" cx="78%" cy="18%" r="40%">
      <stop offset="0%"   stop-color="#e8813a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#e8813a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="20%" cy="82%" r="35%">
      <stop offset="0%"   stop-color="#4a9eff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e8813a"/>
      <stop offset="100%" stop-color="#f5b942"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- backgrounds -->
  <rect width="1400" height="480" fill="url(#bg)"/>
  <rect width="1400" height="480" fill="url(#glow-o)"/>
  <rect width="1400" height="480" fill="url(#glow-b)"/>

