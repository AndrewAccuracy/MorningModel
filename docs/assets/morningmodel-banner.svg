  <text x="900" y="171" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#777">AI TOP 10</text>
  <line x1="900" y1="175" x2="1305" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="900" y="191" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#1a1a1a">1. Google Search as you know it is over</text>
  <text x="900" y="203" font-family="Arial,sans-serif" font-size="8" fill="#555">25年来最根本变革，AI驱动搜索框，引入24/7信息代理。</text>
  <text x="900" y="213" font-family="Arial,sans-serif" font-size="7.5" fill="#bbb">TechCrunch AI</text>
  <text x="900" y="229" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#1a1a1a">2. Gemini 3.5 Flash: Google bets on agents, not chatbots</text>
  <text x="900" y="241" font-family="Arial,sans-serif" font-size="8" fill="#555">专为编码和自主AI代理设计，速度领先前沿模型4倍。</text>
  <text x="900" y="251" font-family="Arial,sans-serif" font-size="7.5" fill="#bbb">TechCrunch AI</text>
  <text x="900" y="267" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#1a1a1a">3. Cerebras $60B IPO: Slowly, then All at Once</text>
  <text x="900" y="279" font-family="Arial,sans-serif" font-size="8" fill="#555">AI硬件领域重大IPO，获OpenAI万亿参数推理订单。</text>
  <text x="900" y="289" font-family="Arial,sans-serif" font-size="7.5" fill="#bbb">Latent Space</text>
  <line x1="882" y1="298" x2="1322" y2="298" stroke="#ddd" stroke-width="0.8"/>

  <!-- Finance section -->
  <text x="900" y="315" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#777">FINANCE TOP 10</text>
  <line x1="900" y1="319" x2="1305" y2="319" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="900" y="335" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#1a1a1a">1. Putin-Xi talks revive stalled Russian gas pipeline</text>
  <text x="900" y="347" font-family="Arial,sans-serif" font-size="8" fill="#555">伊朗战争扰乱中国石油进口，重启西伯利亚管道谈判。</text>
  <text x="900" y="357" font-family="Arial,sans-serif" font-size="7.5" fill="#bbb">CNBC</text>
  <text x="900" y="373" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#1a1a1a">2. SpaceX picks Goldman for record-breaking IPO</text>
  <text x="900" y="385" font-family="Arial,sans-serif" font-size="8" fill="#555">1.25万亿美元估值，最快本周公开招股书。</text>
  <text x="900" y="395" font-family="Arial,sans-serif" font-size="7.5" fill="#bbb">CNBC</text>

